<html lang="en">
<head>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    
:root {
    --primary: #052697;
    --primary-dark: #031A6B;
    --secondary: #FCD007;
    --accent: #F28C00;
    --danger: #DC2626;
    --warning: #F59E0B;
    --white: #FFFFFF;
    --light: #F4F7FF;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-600: #475569;
    --gray-800: #051557;
    --shadow-sm: 0 1px 3px rgba(5,38,151,0.1);
    --shadow-md: 0 4px 6px rgba(5,38,151,0.1);
    --shadow-lg: 0 10px 25px rgba(5,38,151,0.15);
    --shadow-xl: 0 20px 50px rgba(5,38,151,0.2);
    --radius: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F1F5F9;
            color: var(--gray-800);
            min-height: 100vh;
        }

        /* Top Navigation */
        .admin-nav {
            background: white;
            padding: 0 30px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .admin-logo i {
            font-size: 1.8rem;
            color: var(--secondary);
        }

        .admin-logo span {
            font-size: 0.75rem;
            background: var(--danger);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .admin-user i {
            font-size: 2rem;
            color: var(--primary);
        }

        /* Main Layout */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: var(--transition);
            border-left: 4px solid var(--primary);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card.reviews {
            border-left-color: var(--secondary);
        }

        .stat-card.pending {
            border-left-color: var(--warning);
        }

        .stat-card.confirmed {
            border-left-color: var(--accent);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }

        .stat-icon.appointments-icon {
            background: linear-gradient(135deg, var(--primary), #0284C7);
        }

        .stat-icon.reviews-icon {
            background: linear-gradient(135deg, var(--secondary), #0D9488);
        }

        .stat-icon.pending-icon {
            background: linear-gradient(135deg, var(--warning), #D97706);
        }

        .stat-icon.confirmed-icon {
            background: linear-gradient(135deg, var(--accent), #16A34A);
        }

        .stat-info h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .stat-info p {
            color: var(--gray-600);
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            background: white;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 25px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
            color: var(--gray-600);
            font-family: 'Inter', sans-serif;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .tab-btn:hover:not(.active) {
            background: var(--gray-100);
        }

        /* Content Area */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .filter-select {
            padding: 12px 20px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }

        .refresh-btn {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .refresh-btn:hover {
            background: var(--primary-dark);
        }

        /* Table */
.table-container {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    /* MOBILE SCROLL FIX */
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

        thead {
            background: var(--gray-800);
            color: white;
        }

        th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.9rem;
        }

        tbody tr {
            transition: var(--transition);
        }

        tbody tr:hover {
            background: var(--gray-100);
        }

        /* Status Badges */
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-confirmed {
            background: #D1FAE5;
            color: #065F46;
        }

        .status-completed {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .status-cancelled {
            background: #FEE2E2;
            color: #991B1B;
        }

        /* Reference ID */
        .ref-id {
            font-family: 'Courier New', monospace;
            background: var(--gray-100);
            padding: 3px 10px;
            border-radius: 5px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85rem;
        }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .btn-edit:hover {
            background: #BFDBFE;
        }

        .btn-delete {
            background: #FEE2E2;
            color: #991B1B;
        }

        .btn-delete:hover {
            background: #FECACA;
        }

        .btn-confirm {
            background: #D1FAE5;
            color: #065F46;
        }

        .btn-confirm:hover {
            background: #A7F3D0;
        }

        /* Star Display */
        .stars-display {
            color: #FFD700;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: var(--shadow-xl);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h2 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal .form-group {
            margin-bottom: 15px;
        }

        .modal label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .btn-cancel {
            background: var(--gray-200);
            color: var(--gray-800);
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
            font-weight: 500;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { background: var(--accent); }
        .toast.error { background: var(--danger); }

        /* Loading */
        .loading-row td {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--gray-600);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gray-300);
            margin-bottom: 15px;
        }

        /* Confirm Dialog */
        .confirm-dialog {
            text-align: center;
        }

        .confirm-dialog i {
            font-size: 3rem;
            color: var(--danger);
            margin-bottom: 15px;
        }

        .confirm-dialog p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-nav {
                padding: 0 15px;
            }
            
            .admin-logo {
                font-size: 1.2rem;
            }

            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 10px;
            }

            .action-btns {
                flex-direction: column;
            }

            .search-bar {
                flex-direction: column;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="admin-nav">
        <div class="admin-logo">
            <a href="#" class="logo">
    <img src="images.png" alt="NewCare Logo" style="height: 55px; width: auto; margin-right: 10px;">
</a>
        </div>
        <div class="admin-user">
            <i class="fas fa-user-shield"></i>
            <span>Hospital Manager</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="admin-container">
        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon appointments-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalAppointments">0</h3>
                    <p>Total Appointments</p>
                </div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon pending-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="pendingCount">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="stat-card confirmed">
                <div class="stat-icon confirmed-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="confirmedCount">0</h3>
                    <p>Confirmed</p>
                </div>
            </div>
            <div class="stat-card reviews">
                <div class="stat-icon reviews-icon">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalReviews">0</h3>
                    <p>Total Reviews</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('appointments')">
                <i class="fas fa-calendar-check"></i> Appointments
            </button>
            <button class="tab-btn" onclick="switchTab('reviews')">
                <i class="fas fa-star"></i> Reviews
            </button>
        </div>

        <!-- Appointments Tab -->
        <div class="tab-content active" id="appointmentsTab">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="🔍 Search by name, phone, or reference ID..." id="appointmentSearch" oninput="filterAppointments()">
                <select class="filter-select" id="statusFilter" onchange="filterAppointments()">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button class="refresh-btn" onclick="loadAppointments()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Ref ID</th>
                            <th>Patient</th>
                            <th>Phone</th>
                            <th class="hide-mobile">Doctor</th>
                            <th class="hide-mobile">Specialty</th>
                            <th class="hide-mobile">Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTableBody">
                        <tr class="loading-row">
                            <td colspan="8">
                                <div class="spinner"></div>
                                Loading appointments...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Reviews Tab -->
        <div class="tab-content" id="reviewsTab">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="🔍 Search reviews..." id="reviewSearch" oninput="filterReviews()">
                <button class="refresh-btn" onclick="loadReviews()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Rating</th>
                            <th>Review</th>
                            <th class="hide-mobile">Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reviewsTableBody">
                        <tr class="loading-row">
                            <td colspan="5">
                                <div class="spinner"></div>
                                Loading reviews...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal" id="editModalContent"></div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="confirm-dialog">
                <i class="fas fa-exclamation-triangle"></i>
                <h2>Confirm Delete</h2>
                <p id="deleteMessage">Are you sure you want to delete this item?</p>
                <div class="modal-buttons" style="justify-content: center;">
                    <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                    <button class="btn-save" style="background: var(--danger);" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQJeB1o4W6KnC_OlxGc1u1aPWsv40bICo",
            authDomain: "genesis-aec98.firebaseapp.com",
            projectId: "genesis-aec98",
            storageBucket: "genesis-aec98.firebasestorage.app",
            messagingSenderId: "1071823452533",
            appId: "1:1071823452533:web:ff7a7dd592249a6ea1fb3c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================
        // GLOBAL STATE
        // ============================================
        let allAppointments = [];
        let allReviews = [];
        let currentDeleteId = null;
        let currentDeleteType = null;

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'appointments') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('appointmentsTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('reviewsTab').classList.add('active');
            }
        }

        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ============================================
        // LOAD STATISTICS
        // ============================================
        async function loadStats() {
            try {
                const appointmentsSnap = await db.collection('appointments').get();
                const reviewsSnap = await db.collection('reviews').get();
                
                const totalApps = appointmentsSnap.size;
                let pending = 0, confirmed = 0;
                
                appointmentsSnap.forEach(doc => {
                    const status = doc.data().status;
                    if (status === 'pending') pending++;
                    if (status === 'confirmed') confirmed++;
                });
                
                document.getElementById('totalAppointments').textContent = totalApps;
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('confirmedCount').textContent = confirmed;
                document.getElementById('totalReviews').textContent = reviewsSnap.size;
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // ============================================
        // LOAD APPOINTMENTS
        // ============================================
        async function loadAppointments() {
            const tbody = document.getElementById('appointmentsTableBody');
            tbody.innerHTML = '<tr class="loading-row"><td colspan="8"><div class="spinner"></div>Loading...</td></tr>';
            
            try {
                const snapshot = await db.collection('appointments')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                allAppointments = [];
                snapshot.forEach(doc => {
                    allAppointments.push({ id: doc.id, ...doc.data() });
                });
                
                renderAppointments(allAppointments);
                loadStats();
                
            } catch (error) {
                console.error('Error loading appointments:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading appointments</p></td></tr>';
            }
        }

        function renderAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTableBody');
            
            if (appointments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-calendar-xmark"></i><p>No appointments found</p></td></tr>';
                return;
            }
            
            tbody.innerHTML = appointments.map(app => {
                const refId = app.id.slice(-8).toUpperCase();
                const date = app.createdAt ? new Date(app.createdAt.toDate()).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric'
                }) : 'N/A';
                
                const appDate = app.preferredDate || 'N/A';
                const statusClass = `status-${app.status || 'pending'}`;
                
                return `
                    <tr>
                        <td><span class="ref-id">${refId}</span></td>
                        <td><strong>${escapeHtml(app.patientName || 'N/A')}</strong></td>
                        <td>${escapeHtml(app.phone || 'N/A')}</td>
                        <td class="hide-mobile">${escapeHtml(app.doctor || 'N/A')}</td>
                        <td class="hide-mobile">${escapeHtml(app.specialty || 'N/A')}</td>
                        <td class="hide-mobile">${appDate}</td>
                        <td><span class="status-badge ${statusClass}">${app.status || 'pending'}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-edit" onclick="editAppointment('${app.id}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn-action btn-delete" onclick="confirmDelete('${app.id}', 'appointment')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterAppointments() {
            const searchTerm = document.getElementById('appointmentSearch').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filtered = allAppointments;
            
            if (searchTerm) {
                filtered = filtered.filter(app => 
                    (app.patientName && app.patientName.toLowerCase().includes(searchTerm)) ||
                    (app.phone && app.phone.includes(searchTerm)) ||
                    app.id.toLowerCase().includes(searchTerm)
                );
            }
            
            if (statusFilter !== 'all') {
                filtered = filtered.filter(app => app.status === statusFilter);
            }
            
            renderAppointments(filtered);
        }

        // ============================================
        // EDIT APPOINTMENT
        // ============================================
        function editAppointment(id) {
            const app = allAppointments.find(a => a.id === id);
            if (!app) return;
            
            const refId = id.slice(-8).toUpperCase();
            
            document.getElementById('editModalContent').innerHTML = `
                <h2><i class="fas fa-edit"></i> Edit Appointment</h2>
                <p style="margin-bottom: 15px;">Reference ID: <span class="ref-id">${refId}</span></p>
                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" id="editPatientName" value="${escapeHtml(app.patientName || '')}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="editPhone" value="${escapeHtml(app.phone || '')}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" value="${escapeHtml(app.email || '')}">
                </div>
                <div class="form-group">
                    <label>Doctor</label>
                    <input type="text" id="editDoctor" value="${escapeHtml(app.doctor || '')}">
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <input type="text" id="editSpecialty" value="${escapeHtml(app.specialty || '')}">
                </div>
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" id="editDate" value="${app.preferredDate || ''}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="pending" ${app.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="confirmed" ${app.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                        <option value="completed" ${app.status === 'completed' ? 'selected' : ''}>Completed</option>
                        <option value="cancelled" ${app.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button class="btn-save" onclick="saveAppointment('${id}')">Save Changes</button>
                </div>
            `;
            
            document.getElementById('editModal').classList.add('active');
        }

        async function saveAppointment(id) {
            const updatedData = {
                patientName: document.getElementById('editPatientName').value,
                phone: document.getElementById('editPhone').value,
                email: document.getElementById('editEmail').value,
                doctor: document.getElementById('editDoctor').value,
                specialty: document.getElementById('editSpecialty').value,
                preferredDate: document.getElementById('editDate').value,
                status: document.getElementById('editStatus').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                await db.collection('appointments').doc(id).update(updatedData);
                showToast('✅ Appointment updated successfully!', 'success');
                closeEditModal();
                loadAppointments();
            } catch (error) {
                console.error('Error updating:', error);
                showToast('Failed to update appointment', 'error');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // ============================================
        // LOAD REVIEWS
        // ============================================
        async function loadReviews() {
            const tbody = document.getElementById('reviewsTableBody');
            tbody.innerHTML = '<tr class="loading-row"><td colspan="5"><div class="spinner"></div>Loading...</td></tr>';
            
            try {
                const snapshot = await db.collection('reviews')
                    .orderBy('timestamp', 'desc')
                    .get();
                
                allReviews = [];
                snapshot.forEach(doc => {
                    allReviews.push({ id: doc.id, ...doc.data() });
                });
                
                renderReviews(allReviews);
                loadStats();
                
            } catch (error) {
                console.error('Error loading reviews:', error);
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading reviews</p></td></tr>';
            }
        }

        function renderReviews(reviews) {
            const tbody = document.getElementById('reviewsTableBody');
            
            if (reviews.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fas fa-comment-slash"></i><p>No reviews found</p></td></tr>';
                return;
            }
            
            tbody.innerHTML = reviews.map(review => {
                const starsHtml = Array(5).fill(0).map((_, i) => 
                    `<i class="fas fa-star" style="color: ${i < (review.stars || 0) ? '#FFD700' : '#E2E8F0'};"></i>`
                ).join('');
                
                const date = review.timestamp ? 
                    new Date(review.timestamp.toDate()).toLocaleDateString('en-IN', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    }) : 'N/A';
                
                return `
                    <tr>
                        <td><strong>${escapeHtml(review.name || 'Anonymous')}</strong></td>
                        <td><span class="stars-display">${starsHtml}</span></td>
                        <td style="max-width: 300px;">${escapeHtml(review.message || '')}</td>
                        <td class="hide-mobile">${date}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-action btn-edit" onclick="editReview('${review.id}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn-action btn-delete" onclick="confirmDelete('${review.id}', 'review')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterReviews() {
            const searchTerm = document.getElementById('reviewSearch').value.toLowerCase();
            
            let filtered = allReviews;
            
            if (searchTerm) {
                filtered = filtered.filter(review => 
                    (review.name && review.name.toLowerCase().includes(searchTerm)) ||
                    (review.message && review.message.toLowerCase().includes(searchTerm))
                );
            }
            
            renderReviews(filtered);
        }

        // ============================================
        // EDIT REVIEW
        // ============================================
        function editReview(id) {
            const review = allReviews.find(r => r.id === id);
            if (!review) return;
            
            document.getElementById('editModalContent').innerHTML = `
                <h2><i class="fas fa-edit"></i> Edit Review</h2>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editReviewName" value="${escapeHtml(review.name || '')}">
                </div>
                <div class="form-group">
                    <label>Rating (1-5)</label>
                    <select id="editReviewStars">
                        <option value="5" ${review.stars === 5 ? 'selected' : ''}>⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4" ${review.stars === 4 ? 'selected' : ''}>⭐⭐⭐⭐ (4)</option>
                        <option value="3" ${review.stars === 3 ? 'selected' : ''}>⭐⭐⭐ (3)</option>
                        <option value="2" ${review.stars === 2 ? 'selected' : ''}>⭐⭐ (2)</option>
                        <option value="1" ${review.stars === 1 ? 'selected' : ''}>⭐ (1)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Review Message</label>
                    <textarea id="editReviewMessage" rows="4">${escapeHtml(review.message || '')}</textarea>
                </div>
                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button class="btn-save" onclick="saveReview('${id}')">Save Changes</button>
                </div>
            `;
            
            document.getElementById('editModal').classList.add('active');
        }

        async function saveReview(id) {
            const updatedData = {
                name: document.getElementById('editReviewName').value,
                stars: parseInt(document.getElementById('editReviewStars').value),
                message: document.getElementById('editReviewMessage').value,
                editedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                await db.collection('reviews').doc(id).update(updatedData);
                showToast('✅ Review updated successfully!', 'success');
                closeEditModal();
                loadReviews();
            } catch (error) {
                console.error('Error updating:', error);
                showToast('Failed to update review', 'error');
            }
        }

        // ============================================
        // DELETE CONFIRMATION
        // ============================================
        function confirmDelete(id, type) {
            currentDeleteId = id;
            currentDeleteType = type;
            
            const message = type === 'appointment' ? 
                'Are you sure you want to delete this appointment? This action cannot be undone.' :
                'Are you sure you want to delete this review? This action cannot be undone.';
            
            document.getElementById('deleteMessage').textContent = message;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            currentDeleteId = null;
            currentDeleteType = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
            if (!currentDeleteId || !currentDeleteType) return;
            
            try {
                const collection = currentDeleteType === 'appointment' ? 'appointments' : 'reviews';
                await db.collection(collection).doc(currentDeleteId).delete();
                
                showToast('✅ Deleted successfully!', 'success');
                closeDeleteModal();
                
                if (currentDeleteType === 'appointment') {
                    loadAppointments();
                } else {
                    loadReviews();
                }
            } catch (error) {
                console.error('Error deleting:', error);
                showToast('Failed to delete', 'error');
            }
        });

        // ============================================
        // MODAL CLOSE HANDLERS
        // ============================================
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });

        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEditModal();
                closeDeleteModal();
            }
        });

        // ============================================
        // UTILITY
        // ============================================
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            loadAppointments();
            loadReviews();
            loadStats();
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadStats();
            }, 30000);
            
            console.log('🔐 Admin Dashboard Ready');
            console.log('📊 Managing appointments & reviews');
        }

        init();
    </script>
</body>
</html>
